name: Package Windows FLUX
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build portable package
        shell: pwsh
        run: |
          $runtime = node -p "require('electron')" | Select-Object -Last 1
          if (!(Test-Path $runtime)) { throw 'Electron runtime is missing.' }
          Copy-Item (Split-Path $runtime) FLUX -Recurse
          Rename-Item FLUX/electron.exe FLUX.exe
          $app = New-Item -ItemType Directory -Path FLUX/resources/app
          Copy-Item dist,desktop,browser-helper,LICENSE -Destination $app.FullName -Recurse
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          @{name='flux';version=$version;main='desktop/main.cjs'} | ConvertTo-Json | Set-Content "$($app.FullName)/package.json"
          Compress-Archive FLUX FLUX-Windows-x64.zip -CompressionLevel Fastest
          Compress-Archive browser-helper FLUX-YouTube-Link.zip -CompressionLevel Fastest
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid release tag' }
          gh release create $env:RELEASE_TAG FLUX-Windows-x64.zip FLUX-YouTube-Link.zip --target ${{ github.sha }} --title "FLUX $env:RELEASE_TAG for Windows" --notes "Extract the full ZIP and launch FLUX.exe. Select Desktop audio to use system audio and follow album artwork."
