name: Package Windows FLUX
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build portable package
        shell: pwsh
        run: |
          $runtime = node -p "require('electron')" | Select-Object -Last 1
          if (!(Test-Path $runtime)) { throw 'Electron runtime is missing.' }
          Copy-Item (Split-Path $runtime) FLUX -Recurse
          Rename-Item FLUX/electron.exe FLUX.exe
          $app = New-Item -ItemType Directory -Path FLUX/resources/app
          Copy-Item dist,desktop,LICENSE -Destination $app.FullName -Recurse
          '{"name":"flux","version":"1.1.0","main":"desktop/main.cjs"}' | Set-Content "$($app.FullName)/package.json"
          Compress-Archive FLUX FLUX-Windows-x64.zip -CompressionLevel Fastest
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.0 FLUX-Windows-x64.zip --target ${{ github.sha }} --title "FLUX 1.1 — Windows desktop mode" --notes "Extract the full zip, launch FLUX.exe, and choose Desktop audio while music is playing. Includes the five redesigned environments and album-art palettes."
