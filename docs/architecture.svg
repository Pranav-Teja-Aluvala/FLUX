<svg xmlns="http://www.w3.org/2000/svg" width="960" height="238" viewBox="0 0 960 238" role="img" aria-labelledby="title description">
  <title id="title">FLUX playback architecture</title>
  <desc id="description">A YouTube tab sends audio and track metadata to the FLUX theater. Web Audio drives both visuals. Metadata drives synced lyrics. Local analysis is optional.</desc>
  <rect width="960" height="238" rx="20" fill="#111721"/>
  <g fill="none" stroke="#354359">
    <rect x="28" y="83" width="196" height="72" rx="12"/>
    <rect x="292" y="83" width="202" height="72" rx="12"/>
    <rect x="562" y="25" width="368" height="52" rx="10"/>
    <rect x="562" y="93" width="368" height="52" rx="10"/>
    <rect x="562" y="161" width="368" height="52" rx="10"/>
  </g>
  <path d="M224 119h68m202 0h68m-35 0V51h35m-35 68v68h35" fill="none" stroke="#8097af" stroke-width="2"/>
  <g fill="#b8efde"><circle cx="292" cy="119" r="4"/><circle cx="562" cy="51" r="4"/><circle cx="562" cy="119" r="4"/><circle cx="562" cy="187" r="4"/></g>
  <g font-family="system-ui, sans-serif">
    <g fill="#f3f7fa" font-size="17" font-weight="700">
      <text x="49" y="113">YouTube tab</text><text x="315" y="113">FLUX theater</text>
      <text x="586" y="48">Visuals</text><text x="586" y="116">Timed text</text><text x="586" y="184">Local analysis</text>
    </g>
    <g fill="#b6c4d2" font-size="13">
      <text x="49" y="136">Audio and player state</text><text x="315" y="136">Web Audio + player clock</text>
      <text x="586" y="66">Spectrum and Singularity</text><text x="586" y="134">LRCLIB and YouTube captions</text>
      <text x="586" y="202">Optional Windows companion</text>
    </g>
  </g>
</svg>
